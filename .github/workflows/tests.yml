name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one stable name: the merge bot reads this check on the PR head commit.
  # No path filters on purpose: a required check must run on every PR.
  pytest:
    runs-on: [self-hosted, ci-lenovo, sentinel-smdl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Lenovo-260 has only Windows PowerShell 5.1 (no pwsh): shell is powershell, no && / || / ternaries.
      - name: Resolve Python 3.12
        shell: powershell
        run: |
          $py = 'C:\Program Files\Python312\python.exe'
          if (-not (Test-Path $py)) { $py = 'C:\Users\azfar\AppData\Local\Programs\Python\Python312\python.exe' }
          if (-not (Test-Path $py)) { throw 'Python 3.12 not found on this runner' }
          "PY312=$py" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Create venv and install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PY312 -m venv .venv-ci
          if ($LASTEXITCODE -ne 0) { throw 'venv creation failed' }
          $venvPy = Join-Path $PWD '.venv-ci\Scripts\python.exe'
          # rembg[cpu] (onnxruntime) is a heavy optional extra that the app imports lazily; the
          # tests never touch it, so it is left out of the CI install.
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*rembg' } | Set-Content -Encoding ascii requirements-ci.txt
          $ok = $false
          foreach ($attempt in 1..3) {
            & $venvPy -m pip install --disable-pip-version-check -r requirements-ci.txt pytest
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "pip install failed (attempt $attempt of 3)"
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $ok) { throw 'pip install failed after 3 attempts' }

      # Gated: tests/test_downloader.py (mocked, no network/GPU/docker/secrets).
      # Left out: tests/fresh-install/ (bash, docker-compose and WSL2 scripts, not pytest tests).
      - name: Run pytest
        shell: powershell
        env:
          DB_PATH: ${{ runner.temp }}\smdl-test\jobs.db
          CONFIG_FILE: ${{ runner.temp }}\smdl-test\smdl.json
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD '.venv-ci\Scripts\python.exe') -m pytest tests/test_downloader.py -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
