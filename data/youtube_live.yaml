# Curated YouTube 24/7 live news streams — exposed in the IPTV browser
# as a "youtube-live" source. URLs are resolved on-demand via yt-dlp
# (channel URL → current m3u8 manifest) and cached for 30 min.
#
# Why YouTube? Their CDN is globally served — these channels play from
# any country without the geo-blocking that hits broadcaster CDNs
# (cloudfront, amagi, viloud). Real bypass for MY/ID news content
# without needing a VPS or residential proxy.
#
# To add a channel: find a 24/7 livestream on YouTube, grab the @handle,
# add an entry below. yt-dlp resolves https://youtube.com/@<handle>/live
# at play time.
#
# Alternatively, point at one specific live broadcast with `video_id: <id>`
# (the v= part of a watch?v= URL) — use this when the @handle/live page
# resolves to the wrong stream or the channel runs several concurrent
# live feeds. An explicit `url:` field overrides both.
channels:

  # ── Singapore / SE Asia ─────────────────────────────────────────
  - id: cna
    name: Channel News Asia
    handle: channelnewsasia
    country: SG
    categories: [news]
    logo: https://yt3.googleusercontent.com/ytc/AIdro_kf4-XQz7Sjpz9rJOdMlAQrW1u1xKzFi0YCKbZIaO72WqY=s176

  - id: cna-asia-tonight
    name: CNA Asia Tonight
    handle: channelnewsasia
    country: SG
    categories: [news]
    # Same handle as cna — variants for different content shows. yt-dlp
    # resolves to whichever live stream is currently active.

  - id: 8world
    name: 8world 8视界 (24/7)
    # Mediacorp's official Chinese-news 24/7 live stream (Channel 8 news
    # brand). Pinned by channel id, not @handle — the @8world handle is a
    # separate feed; this UC… channel is the one running the 24/7 simulcast.
    url: https://www.youtube.com/channel/UCUqUtr0w-K8W4AfpbHiYSaQ/live
    country: SG
    categories: [news]

  # BERITA (Malay) and Seithi (Tamil) are Mediacorp's official news
  # channels for the Suria / Vasantham communities. Unlike 8world/CNA
  # they are NOT 24/7 — they go live only during scheduled bulletins, so
  # the /live page resolves during news windows and errors gracefully the
  # rest of the day. Pinned to /live so it always grabs the current bulletin.
  - id: berita-mediacorp
    name: BERITA Mediacorp (Malay)
    url: https://www.youtube.com/channel/UCUnNm_u4ibQrL4LvVsx9cYw/live
    country: SG
    categories: [news]

  - id: seithi-mediacorp
    name: Seithi Mediacorp (Tamil)
    handle: seithi.mediacorp
    country: SG
    categories: [news]

  # SG news publishers that livestream only occasionally (events, press
  # conferences, breaking news) — off-air most of the day. The /live page
  # resolves when they're streaming; the UI live/off-air badge tells the
  # viewer up front rather than surfacing a broken player on tap.
  - id: straits-times
    name: The Straits Times
    handle: TheStraitsTimes
    country: SG
    categories: [news]

  - id: today-online
    name: TODAY
    handle: TODAYonline
    country: SG
    categories: [news]

  - id: mothership-sg
    name: Mothership
    handle: mothershipsg
    country: SG
