[package]
name = "sentinel-smdl-desktop"
version = "0.1.0"
description = "Sentinel SMDL desktop — Tauri wrap of the Mini App"
authors = ["Azfar"]
license = ""
repository = "https://github.com/azfarh95/sentinel-smdl"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smdl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
